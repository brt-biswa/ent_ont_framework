[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ontology"
version = "0.1.0"
description = "Enterprise Ontology Framework for Agentic AI - reusable Databricks-native semantic layer"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "sqlglot>=25.0.0",
    "databricks-sql-connector>=3.1.0",
    "databricks-sdk>=0.28.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mcp>=1.2.0",
    "mlflow>=2.14.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "cachetools>=5.3.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5.0", "build>=1.2.0"]

[project.entry-points."databricks.jobs"]
bootstrap_lakebase = "enterprise_ontology.jobs.bootstrap_lakebase:main"
run_drift_detection = "enterprise_ontology.drift.detector:main"
run_cache_warm = "enterprise_ontology.cache.l2_lakebase_cache:warm_main"
run_evaluation = "enterprise_ontology.evaluation.gold_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
