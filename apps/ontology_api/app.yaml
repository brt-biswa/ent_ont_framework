# Databricks App configuration — REST API (PRD Sec. 20 endpoints).
command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: ONTOLOGY_CATALOG
    valueFrom: ontology_catalog
  - name: DATABRICKS_WAREHOUSE_HTTP_PATH
    valueFrom: warehouse_http_path
  - name: LAKEBASE_HOST
    valueFrom: lakebase_host
  - name: LAKEBASE_DATABASE
    value: ontology_state
  - name: LAKEBASE_USER
    valueFrom: lakebase_service_principal
  - name: SQL_POLICY_VERSION
    value: "1.0.0"
  - name: PLANNER_MODEL_ENDPOINT
    value: databricks-claude-sonnet
