# Databricks App configuration — governance / admin UI (change requests,
# certification, drift dashboard). Built with Streamlit for a fast,
# low-maintenance internal tool; swap for a React app if a domain team's
# platform standard requires it — app.py only talks to the framework's
# public services, never to Unity Catalog/Lakebase directly.
command: ["streamlit", "run", "app.py", "--server.port", "8000", "--server.address", "0.0.0.0"]

env:
  - name: ONTOLOGY_CATALOG
    valueFrom: ontology_catalog
  - name: DATABRICKS_WAREHOUSE_HTTP_PATH
    valueFrom: warehouse_http_path
  - name: LAKEBASE_HOST
    valueFrom: lakebase_host
  - name: LAKEBASE_DATABASE
    value: ontology_state
  - name: LAKEBASE_USER
    valueFrom: lakebase_service_principal
